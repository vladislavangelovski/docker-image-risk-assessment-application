services:
  postgres:
    image: pgvector/pgvector:pg17
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  cve-store:
    build:
      context: .
      dockerfile: cve-store-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      INGEST_ENABLED: "true"
      INGEST_STARTUP_ENABLED: "false"
      INGEST_BOOTSTRAP_ENABLED: ${INGEST_BOOTSTRAP_ENABLED:-false}

  redis:
    image: redis:7
    container_name: redis-local
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  scan-service:
    container_name: scan-service
    build:
      context: .
      dockerfile: scan-service/Dockerfile
    image: docker-image-risk-assessment-application-scan-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/riskdb"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_FLYWAY_URL: "jdbc:postgresql://postgres:5432/riskdb"
      SPRING_FLYWAY_USER: "${POSTGRES_USER}"
      SPRING_FLYWAY_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "riskdb"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    depends_on:
      - postgres
      - redis

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama


  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      cve-store:
        condition: service_healthy
      scan-service:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/riskdb"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_FLYWAY_URL: "jdbc:postgresql://postgres:5432/riskdb"
      SPRING_FLYWAY_USER: "${POSTGRES_USER}"
      SPRING_FLYWAY_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "riskdb"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

      # === services.scan ===
      SERVICES_SCAN_BASE_URL: http://scan-service:8080
      SERVICES_SCAN_ASSESS_PATH: /api/v1/scans
      # === services.cvestore ===
      SERVICES_CVESTORE_BASE_URL: http://cve-store:8080
      SERVICES_CVESTORE_BY_ID_PATH: /api/v1/cves/{cveId}
      SERVICES_CVESTORE_LIST_PATH: /api/v1/cves
      SERVICES_CVESTORE_EPSS_PATH: /api/v1/cves/{cveId}/epss
      # === embeddings (Ollama) ===
      AI_EMBEDDINGS_BASE_URL: "http://ollama:11434"
      EMBEDDINGS_MODEL: nomic-embed-text
      EMBEDDINGS_TIMEOUT_MS: "5000"
      AI_EMBEDDINGS_DIM: "768"
      # === vector store datasource (pgvector DB) ===
      VECTORSTORE_DATASOURCE_URL: jdbc:postgresql://postgres:5432/riskdb
      VECTORSTORE_DATASOURCE_USERNAME: risk
      VECTORSTORE_DATASOURCE_PASSWORD: dev

    ports:
      - "8083:8083"


  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    depends_on:
      cve-store:
        condition: service_healthy
      scan-service:
        condition: service_healthy
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVICES_SCAN_BASE_URL: http://scan-service:8080
      SERVICES_CVE_STORE_BASE_URL: http://cve-store:8080
      SERVICES_AI_BASE_URL: http://ai-service:8083
      GATEWAY_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"


volumes:
  dbdata:
  redis-data:
  ollama-models:
