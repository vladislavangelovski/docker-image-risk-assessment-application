version: "3.8"

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: riskdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk -d riskdb"]
      interval: 10s
      retries: 5
    ports:
      - "5432:5432"