services:
  postgres:
    image: pgvector/pgvector:pg17
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  keycloak-db:
    image: pgvector/pgvector:pg17
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: keycloakdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d keycloakdb"]
      interval: 10s
      retries: 5
    volumes:
      - keycloak-dbdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      # Local-dev defaults (override via `.env`); do not use these defaults in production.
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloakdb
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak/realm-risk.json:/opt/keycloak/data/import/realm-risk.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n1 <&3 | grep -q \"200\"'"
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  cve-store:
    build:
      context: .
      dockerfile: cve-store-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      INGEST_ENABLED: "true"
      INGEST_STARTUP_ENABLED: "${INGEST_STARTUP_ENABLED:-true}"
      # Startup should be fast so the stack can come up:
      # EPSS = run only EPSS at startup (recommended day-to-day)
      # ALL  = run NVD + EPSS (use when you want a full lookback backfill)
      INGEST_STARTUP_MODE: "${INGEST_STARTUP_MODE:-EPSS}"

      INGEST_NVD_LOOKBACK_DAYS: "${INGEST_NVD_LOOKBACK_DAYS:-365}"
      INGEST_NVD_MAX_WINDOW_DAYS: "${INGEST_NVD_MAX_WINDOW_DAYS:-120}"
      INGEST_BOOTSTRAP_ENABLED: "${INGEST_BOOTSTRAP_ENABLED:-false}"

      # Enable /actuator/health/liveness and /readiness
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
      MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"

  redis:
    image: redis:7
    container_name: redis-local
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  scan-service:
    container_name: scan-service
    build:
      context: .
      dockerfile: scan-service/Dockerfile
    image: docker-image-risk-assessment-application-scan-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      TRIVY_CACHE_DIR: /var/cache/trivy
      SCAN_DEFAULTS_TIMEOUT_SEC: "300"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/riskdb"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_FLYWAY_URL: "jdbc:postgresql://postgres:5432/riskdb"
      SPRING_FLYWAY_USER: "${POSTGRES_USER}"
      SPRING_FLYWAY_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "riskdb"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - trivy-cache:/var/cache/trivy
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - redis

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      cve-store:
        condition: service_healthy
      scan-service:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${AI_SERVICE_PROFILES:-dev}
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/riskdb"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_FLYWAY_URL: "jdbc:postgresql://postgres:5432/riskdb"
      SPRING_FLYWAY_USER: "${POSTGRES_USER}"
      SPRING_FLYWAY_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "riskdb"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      SERVICES_HTTP_RESPONSE_TIMEOUT_MS: "180000"
      SERVICES_HTTP_READ_TIMEOUT_MS: "180000"
      SERVICES_HTTP_WRITE_TIMEOUT_MS: "180000"
      AI_COMPOSE_MAX_PARALLEL_IMAGE_ASSESSMENTS: "${AI_COMPOSE_MAX_PARALLEL_IMAGE_ASSESSMENTS:-1}"

      # === services.scan ===
      SERVICES_SCAN_BASE_URL: http://scan-service:8080
      SERVICES_SCAN_ASSESS_PATH: /api/v1/scans

      # === services.cvestore ===
      SERVICES_CVESTORE_BASE_URL: http://cve-store:8080
      SERVICES_CVESTORE_BY_ID_PATH: /api/v1/cves/{cveId}
      SERVICES_CVESTORE_LIST_PATH: /api/v1/cves
      SERVICES_CVESTORE_EPSS_PATH: /api/v1/cves/{cveId}/epss

      # === embeddings (Ollama) ===
      EMBEDDINGS_BASE_URL: "http://ollama:11434"
      EMBEDDINGS_MODEL: "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
      EMBEDDINGS_TIMEOUT_MS: "5000"
      EMBEDDINGS_EXPECTED_DIM: "768"
      EMBEDDINGS_STARTUP_ENABLED: "${EMBEDDINGS_STARTUP_ENABLED:-false}"
      EMBEDDINGS_STARTUP_BATCH_SIZE: "${EMBEDDINGS_STARTUP_BATCH_SIZE:-20}"
      EMBEDDINGS_STARTUP_MAX_BATCHES: "${EMBEDDINGS_STARTUP_MAX_BATCHES:-5}"

      # === chat model (Spring AI Ollama) ===
      SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: "${OLLAMA_CHAT_MODEL:-llama3.2:3b-instruct-q4_K_M}"

      # === chat model (Spring AI OpenAI-compatible -> Groq) ===
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_CHAT_MODEL: "${GROQ_CHAT_MODEL:-llama-3.3-70b-versatile}"

      # === optional web search (Brave Search API) ===
      WEBSEARCH_ENABLED: "${WEBSEARCH_ENABLED:-false}"
      WEBSEARCH_TRIGGER: "${WEBSEARCH_TRIGGER:-cve_only}"
      WEBSEARCH_MAX_RESULTS: "${WEBSEARCH_MAX_RESULTS:-5}"
      WEBSEARCH_BRAVE_API_KEY: "${WEBSEARCH_BRAVE_API_KEY:-}"

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    depends_on:
      cve-store:
        condition: service_healthy
      scan-service:
        condition: service_healthy
      ai-service:
        condition: service_started
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVICES_SCAN_BASE_URL: http://scan-service:8080
      SERVICES_CVE_STORE_BASE_URL: http://cve-store:8080
      SERVICES_AI_BASE_URL: http://ai-service:8083
      SERVICES_KEYCLOAK_BASE_URL: http://keycloak:8080

      GATEWAY_SECURITY_ENABLED: "true"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/risk/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/auth/realms/risk
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    depends_on:
      gateway-service:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  dbdata:
  keycloak-dbdata:
  redis-data:
  ollama-models:
  trivy-cache:
