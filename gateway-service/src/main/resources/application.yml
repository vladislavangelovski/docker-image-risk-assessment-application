server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 180s
      default-filters:
        - name: AuthenticationPlaceholderFilter
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${gateway.cors.allowed-origins:*}"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: scan-service
          uri: ${services.scan-base-url}
          predicates:
            - Path=/api/v1/scans/**
        - id: cve-store-service
          uri: ${services.cve-store-base-url}
          predicates:
            - Path=/api/v1/cves/**
        # ai-service (Assessment)
        - id: ai-service-assess
          uri: ${services.ai-base-url}
          predicates:
            - Path=/api/v1/assess/**
          filters:
            - 'RewritePath=/api/v1/assess(?<segment>/?.*), /api/assess${segment}'

        # ai-service (QA)
        - id: ai-service-qa
          uri: ${services.ai-base-url}
          predicates:
            - Path=/api/v1/qa/**
          filters:
            - 'RewritePath=/api/v1/qa(?<segment>/?.*), /api/qa${segment}'

        # ai-service (Admin embeddings) — useful for reindex/search later
        - id: ai-service-admin-embeddings
          uri: ${services.ai-base-url}
          predicates:
            - Path=/api/v1/admin/embeddings/**
          filters:
            - 'RewritePath=/api/v1/admin/embeddings(?<segment>/?.*), /api/admin/embeddings${segment}'

        # ai-service (Semantic search + semantic QA)
        - id: ai-service-semantic
          uri: ${services.ai-base-url}
          predicates:
            - Path=/api/v1/semantic/**
          filters:
            - 'RewritePath=/api/v1/semantic(?<segment>/?.*), /api/semantic${segment}'

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      status:
        http-mapping:
          degraded: 503
      probes:
        enabled: true

gateway:
  cors:
    allowed-origins: "*"
  security:
    enabled: true
    api-key: ${GATEWAY_API_KEY:}
    header: X-API-Key

services:
  scan-base-url: http://scan-service:8080
  cve-store-base-url: http://cve-store:8080
  ai-base-url: http://ai-service:8083
