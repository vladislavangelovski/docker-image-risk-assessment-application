# Use in-memory DB for tests (PostgreSQL compatibility)
spring.datasource.url=jdbc:h2:mem:scan;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Don?t run Flyway during unit tests
spring.flyway.enabled=false

# Keep Redis optional ? our bean handles absence gracefully
# (no need to set spring.data.redis.* here)
