server:
  port: 8083

services:
  scan:
    base-url: http://scan-service:8080
    assess-path: /api/v1/scans

  cvestore:
    base-url: http://cve-store:8080
    by-id-path: /api/v1/cves/{cveId}
    epss-path: /api/v1/cves/{cveId}/epss

  http:
    connect-timeout-ms: 2000
    response-timeout-ms: 5000
    read-timeout-ms: 5000
    write-timeout-ms: 5000
    retry:
      max-attempts: 3
      initial-backoff-ms: 2000
      max-backoff-ms: 10000

ai:
  evidence:
    k-default: 6
  risk:
    coverage-cap: 10
    weights:
      epss: 0.65
      cvss: 0.35
      coverage-bonus: 0.15

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE

embeddings:
  base-url: http://ollama:11434
  model: nomic-embed-text
  timeout-ms: 10000
  expected-dim: 768

vectorstore:
  table: cve_embeddings

spring:
  ai:
    model:
      chat: ollama
    ollama:
      base-url: http://ollama:11434
      chat:
        options:
          model: llama3.2:3b-instruct-fp16
          temperature: 0.0