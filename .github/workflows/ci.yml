name: CI / CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: ${{ github.repository_owner }}
  SHA_TAG: sha-${{ github.sha }}
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  formatting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          key: maven-${{ hashFiles('**/pom.xml') }}
          path: ~/.m2/repository

      - name: Spotless format check
        run: mvn -B -ntp spotless:check

  dependency-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          key: maven-${{ hashFiles('**/pom.xml') }}
          path: ~/.m2/repository

      - name: OWASP dependency check
        run: mvn -B -ntp -DskipTests org.owasp:dependency-check-maven:check

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - common
          - cve-store-service
          - scan-service
          - ai-service
          - gateway-service
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          key: maven-${{ hashFiles('**/pom.xml') }}
          path: ~/.m2/repository

      - name: Build and verify
        run: mvn -B -ntp -pl ${{ matrix.service }} -am verify

      - name: Build image for smoke test
        run: |
          docker build -t ${{ matrix.service }}:smoke -f ./${{ matrix.service }}/Dockerfile .

      - name: Smoke check artifact presence
        run: |
          docker run --rm --entrypoint sh ${{ matrix.service }}:smoke -c "ls -l /app.jar /app/app.jar 2>/dev/null || (echo 'No runnable JAR found' && exit 1)"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for multi-arch, optional)
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v2
        with:
          driver: docker-container

      - name: Build & push ${{ matrix.service }}
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.service }}:${{ env.SHA_TAG }}
            ${{ env.RELEASE_TAG && format('{0}/{1}/{2}:{3}', env.REGISTRY, env.ORG, matrix.service, env.RELEASE_TAG) || '' }}
            ${{ env.RELEASE_TAG && format('{0}/{1}/{2}:latest',   env.REGISTRY, env.ORG, matrix.service)       || '' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show pushed tags
        if: always()
        run: |
          echo "Image(s) for ${{ matrix.service }}:"
          echo "  • $REGISTRY/$ORG/${{ matrix.service }}:$SHA_TAG"
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "  • $REGISTRY/$ORG/${{ matrix.service }}:$RELEASE_TAG"
            echo "  • $REGISTRY/$ORG/${{ matrix.service }}:latest"
          fi
